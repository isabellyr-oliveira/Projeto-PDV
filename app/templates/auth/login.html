<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AAPM</title>
    <!-- CSS Exclusivo de Login -->
    <link rel="stylesheet" href="{{ request.url_for('static', path='CSS/login.css') }}">
</head>
<body>

    <main class="login-container">
        <div class="login-card">
            
            <!-- Logo e Título -->
            <div class="brand-header">
                <img src="{{ request.url_for('static', path='IMG/logo.png') }}" alt="Logo AAPM" class="logo-img">
                <h1>AAPM</h1>
            </div>

            <h2>Acesse sua conta</h2>

            {% if erro %}
                <div class="mensagem-erro">
                    <p>{{ erro }}</p>
                </div>
            {% endif %}

            <form action="/auth/login" method="post">

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Digite seu e-mail" 
                        required 
                        autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha" 
                        placeholder="Digite sua senha" 
                        required 
                        autocomplete="current-password">
                </div>

                <button type="submit" class="btn-entrar">ENTRAR</button>

            </form>

            <footer>
                <p>&copy; 2026 AAPM. Todos os direitos reservados.</p>
            </footer>

        </div>
    </main>

</body>
</html>
