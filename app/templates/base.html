<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PDV{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>Sistema PDV</h1>

        <nav>
            <a href="{{ url_for('index') }}">Início</a>

    </footer>

</body>

</html>
