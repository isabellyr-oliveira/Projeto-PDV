<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema PDV{% endblock %}</title>
    
    <!-- Vincula o CSS local usando o url_for do FastAPI (parâmetro 'path') -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>

    <header>
        <strong>PDV SEDUC</strong>
    </header>

    <main>
        <!-- O conteúdo do home.html será inserido dentro do card estilizado -->
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
