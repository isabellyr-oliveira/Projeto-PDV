<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}Sistema PDV - AAPM{% endblock %}</title>
    
    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- CSS Global -->
    <link rel="stylesheet" href="{{ url_for('static', path='CSS/style.css') }}">
</head>
<body>

    <!-- Header Superior -->
    <header class="app-header">
        <div class="header-brand">
            <img src="{{ url_for('static', path='IMG/logo.png') }}" alt="Logo AAPM" class="header-logo">
            <span>AAPM - PDV</span>
        </div>
        
        <div class="header-user">
            <i class="fa-solid fa-circle-user"></i>
            <span>{{ usuario.nome if usuario else 'Usuário' }}</span>
        </div>
    </header>

    <!-- Conteúdo Dinâmico -->
    <main class="app-main">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
