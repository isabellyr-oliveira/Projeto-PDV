{% if erro %}
    <div style="background-color: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-weight: 500;">
        <i class="fa-solid fa-triangle-exclamation" style="margin-right: 8px;"></i> {{ erro }}
    </div>
{% endif %}

<form action="{{ '/produtos/' + editando.id|string + '/editar' if editando else '/produtos/novo' }}"
      method="post"
      enctype="multipart/form-data"
      style="display: flex; flex-direction: column; gap: 20px;">

    <!-- Campo Nome -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-weight: 600; color: #334155; font-size: 0.9rem;">Nome do Produto:</label>
        <input type="text"
               name="nome"
               class="input-control"
               placeholder="Ex: Camiseta Universitária"
               value="{{ editando.nome if editando else (valores.nome if valores else '') }}"
               required>
    </div>

    <!-- Linha Preço e Estoque -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-weight: 600; color: #334155; font-size: 0.9rem;">Preço (R$):</label>
            <input type="number"
                   name="preco"
                   step="0.01"
                   min="0"
                   class="input-control"
                   placeholder="0,00"
                   value="{{ editando.preco if editando else (valores.preco if valores else '0.00') }}"
                   required>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-weight: 600; color: #334155; font-size: 0.9rem;">Estoque Atual:</label>
            <input type="number"
                   name="estoque_atual"
                   min="0"
                   class="input-control"
                   placeholder="0"
                   value="{{ editando.estoque_atual if editando else (valores.estoque_atual if valores else '0') }}"
                   required>
        </div>
    </div>

    <!-- Categoria -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-weight: 600; color: #334155; font-size: 0.9rem;">Categoria:</label>
        <select name="categoria_id" class="select-control" style="width: 100%;">
            <option value="0">Sem categoria</option>
            {% for c in categorias %}
                <option value="{{ c.id }}"
                    {{ 'selected' if (editando and editando.categoria_id == c.id) or (valores and valores.categoria_id == c.id) else '' }}>
                    {{ c.nome }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- Upload de Imagem -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-weight: 600; color: #334155; font-size: 0.9rem;">
            {{ "Nova Imagem (deixe vazio para manter a atual):" if editando else "Imagem do Produto:" }}
        </label>
        
        {% if editando and editando.imagem_path %}
            <div style="margin-bottom: 8px; display: flex; align-items: center; gap: 12px;">
                <img src="/static/{{ editando.imagem_path }}"
                     alt="{{ editando.nome }}"
                     style="width: 70px; height: 70px; border-radius: 8px; object-fit: cover; border: 1px solid #e2e8f0;">
                <span style="font-size: 0.85rem; color: #64748b;">Imagem cadastrada atualmente</span>
            </div>
        {% endif %}

        <input type="file"
               name="imagem"
               accept=".jpg,.jpeg,.png,.webp"
               class="input-control"
               style="padding: 8px;">
    </div>

    <!-- Botões de Ação -->
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 10px;">
        <button type="submit" class="btn-primary" style="cursor: pointer; border: none;">
            <i class="fa-solid fa-check"></i> {{ "Salvar alterações" if editando else "Criar produto" }}
        </button>
        <a href="/produtos" class="btn-secondary" style="text-decoration: none; display: inline-flex; align-items: center;">
            Cancelar
        </a>
    </div>

</form>
